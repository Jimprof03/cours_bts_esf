<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz – Problèmes sociaux et reconnaissance</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0D1B2A;color:#f0eada;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  h1{color:#F4A261;font-size:1.5rem;text-align:center;letter-spacing:1px;}
  .subtitle{color:#8A9BB0;font-size:0.78rem;letter-spacing:2px;text-transform:uppercase;}
  #quiz-area{width:100%;max-width:680px;}
  .progress-bar{background:#1A3A5C;border-radius:10px;height:6px;margin-bottom:8px;}
  .progress-fill{background:#F4A261;height:6px;border-radius:10px;transition:width 0.4s;}
  .progress-label{font-size:0.7rem;color:#8A9BB0;margin-bottom:14px;letter-spacing:1px;}
  .question-card{background:#0f2040;border:1px solid #1A3A5C;border-radius:14px;padding:24px;}
  .question-num{font-size:0.7rem;color:#F4A261;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
  .question-text{font-size:1rem;font-weight:600;margin-bottom:20px;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{background:#0a1628;border:1.5px solid #1A3A5C;color:#f0eada;padding:12px 16px;border-radius:10px;cursor:pointer;text-align:left;font-size:0.88rem;line-height:1.4;transition:all 0.2s;}
  .option:hover{border-color:#F4A261;background:#1A3A5C;}
  .option.correct{background:#1a4a2e;border-color:#2ecc71;color:#2ecc71;}
  .option.wrong{background:#4a1a1a;border-color:#e74c3c;color:#e74c3c;}
  .option.reveal{background:#1a4a2e;border-color:#2ecc71;color:#2ecc71;}
  .feedback{margin-top:16px;padding:12px;background:#1A3A5C;border-radius:8px;font-size:0.82rem;line-height:1.5;display:none;color:#e8c87a;}
  #btn-next{margin-top:16px;background:#F4A261;color:#0D1B2A;border:none;padding:10px 28px;border-radius:8px;font-weight:700;font-size:0.82rem;letter-spacing:1px;cursor:pointer;width:100%;}
  #btn-next:disabled{opacity:0.4;cursor:not-allowed;}
  #score-panel{display:none;background:#0f2040;border:1px solid #F4A261;border-radius:14px;padding:24px;text-align:center;max-width:680px;width:100%;}
  #score-panel h2{color:#F4A261;font-size:1.8rem;}
  #score-panel p{color:#8A9BB0;margin-top:8px;font-size:0.85rem;}
  #btn-restart{margin-top:16px;background:#F4A261;color:#0D1B2A;border:none;padding:10px 28px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.82rem;letter-spacing:1px;}
</style>
</head>
<body>
<h1>Quiz – Problèmes sociaux et reconnaissance</h1>
<p class="subtitle">BTS ESF</p>
<div id="quiz-area">
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="progress-label" id="progress-label">Question 1 / 10</div>
  <div id="question-container"></div>
  <button id="btn-next" disabled onclick="next()">Question suivante →</button>
</div>
<div id="score-panel">
  <h2 id="score-val"></h2>
  <p id="score-mention"></p>
  <button id="btn-restart" onclick="init()">Recommencer</button>
</div>
<script>
const questions = [
  { q: "Comment définit-on la précarité sociale ?", opts: ["Une insuffisance de revenus pour accéder aux loisirs et partir en vacances régulièrement","Des conditions de vie instables rendant difficile l'accès aux besoins fondamentaux","Une situation administrative provisoire en attente d'une régularisation des droits sociaux","Un statut accordé uniquement aux personnes reconnues officiellement sans domicile fixe"], ans: 1, fb: "La précarité sociale désigne des conditions de vie instables mettant les personnes en difficulté pour assumer leurs besoins fondamentaux (se loger, se soigner, manger...)." },
  { q: "Quel est le seuil de pauvreté pour une personne seule en France ?", opts: ["Revenus inférieurs à 800 euros mensuels pour une personne vivant seule en France","Revenus inférieurs à 1288 euros mensuels pour une personne vivant seule","Revenus inférieurs à 1500 euros mensuels pour une personne seule en France","Revenus inférieurs à 1000 euros mensuels pour une personne vivant seule"], ans: 1, fb: "Le seuil de pauvreté est fixé à 1288€/mois pour une personne seule, ou 2705€ pour un couple avec 2 enfants de moins de 14 ans." },
  { q: "Comment définit-on les inégalités sociales ?", opts: ["Des différences de talent naturel ou de mérite personnel entre individus d'une même société","Des différences de conditions de vie favorisant certaines populations et en défavorisant d'autres","Des écarts de salaires uniquement constatés entre le secteur public et le secteur privé","Des disparités géographiques entre les territoires ruraux isolés et les grandes agglomérations en France"], ans: 1, fb: "Les inégalités sociales sont des différences de conditions de vie favorisant certaines populations et en défavorisant d'autres dans la société." },
  { q: "Qu'est-ce que le processus d'exclusion sociale ?", opts: ["Un dispositif d'aide permettant de sortir durablement les individus de situations de pauvreté","Un processus de mise à l'écart de la société envers un individu ou un groupe","Une procédure judiciaire pour reconduire les personnes étrangères à la frontière","Une mesure administrative de protection pour les personnes vulnérables sans ressources suffisantes"], ans: 1, fb: "Le processus d'exclusion est le processus de mise à l'écart de la société envers un individu ou un groupe d'individus." },
  { q: "Quelles sont les caractéristiques d'un problème social ?", opts: ["Il touche une seule personne isolée et n'a aucune répercussion sur les autres membres de la société","Il touche beaucoup d'individus, a des effets collectifs et nécessite une intervention publique","Il est exclusivement d'ordre économique et peut se régler naturellement par les mécanismes du marché","Il concerne uniquement les personnes étrangères en situation irrégulière sur le territoire national"], ans: 1, fb: "Un problème social touche un nombre important d'individus, a des conséquences individuelles et collectives, et nécessite l'intervention des pouvoirs publics." },
  { q: "Que permet la loi DALO ?", opts: ["Elle accorde un droit à l'emploi opposable garanti à tous les chômeurs longue durée","Elle reconnaît le Droit Au Logement Opposable pour les personnes sans logement décent","Elle crée une allocation chômage spéciale réservée aux personnes en fin de droits d'indemnisation","Elle garantit l'accès totalement gratuit aux soins pour toutes les personnes vivant en grande précarité"], ans: 1, fb: "La loi DALO (Droit Au Logement Opposable) permet aux personnes mal logées de faire valoir juridiquement leur droit au logement devant les pouvoirs publics." },
  { q: "Comment les problèmes sociaux sont-ils reconnus par la collectivité ?", opts: ["Par le vote d'un budget d'urgence spécial au Parlement pour les populations en grande difficulté pour les bénéficiaires","Par des appels de personnalités, manifestations, journées mondiales et diffusion de données par des organismes","Par la signature de traités internationaux entre les pays membres de l'Union Européenne","Par la publication d'un rapport économique annuel du ministère de l'Économie et des Finances"], ans: 1, fb: "Les problèmes sociaux sont reconnus via des appels de personnalités, des manifestations, des journées mondiales et la diffusion de données par des organismes (ex : Secours Catholique)." },
  { q: "Quels indicateurs servent à repérer les problèmes sociaux ?", opts: ["Les sondages d'opinion menés régulièrement auprès des citoyens sur leur satisfaction","Des indicateurs économiques comme le chômage, ou démographiques comme les divorces","Les résultats des élections politiques et le taux global de participation aux scrutins","Les classements internationaux annuels sur le bonheur et la qualité de vie des nations"], ans: 1, fb: "Les problèmes sociaux sont repérés grâce à des indicateurs économiques (taux de chômage) ou démographiques (nombre de personnes vivant seules, divorces...)." },
  { q: "Qu'est-ce que la pauvreté ?", opts: ["Un manque de ressources culturelles et un déficit d'accès à l'éducation tout au long de la vie","Des ressources insuffisantes pour satisfaire ses besoins fondamentaux (monétaire, matérielle, sociale...)","Un statut administratif officiel accordé par la CAF aux bénéficiaires du revenu de solidarité active en France","Une situation temporaire exclusivement liée à une période de chômage subi de manière involontaire"], ans: 1, fb: "La pauvreté c'est avoir des ressources insuffisantes pour satisfaire ses besoins fondamentaux : monétaire, matérielle (énergétique), sociale ou intellectuelle." },
  { q: "Quel exemple d'action concrète résulte de la reconnaissance d'un problème social ?", opts: ["La construction de nouvelles prisons et la création de places supplémentaires pour réduire la criminalité en France","L'ouverture de centres d'hébergement et de réinsertion sociale, et des repas à 1€ pour étudiants boursiers","La création de nouvelles zones commerciales et de centres d'affaires pour stimuler l'emploi local","La mise en place de contrôles fiscaux renforcés pour lutter contre les fraudes aux prestations sociales"], ans: 1, fb: "La reconnaissance des problèmes sociaux conduit à des actions concrètes : ouverture de CHRS, repas à 1€ pour étudiants boursiers, loi DALO, droits pour les personnes handicapées..." }
];
function shuffleArr(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function shuffleOpts(q){
  const idx=q.opts.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return{...q,opts:idx.map(i=>q.opts[i]),ans:idx.indexOf(q.ans)};
}
let shuffled,current,score,answered,currentQ;
function init(){
  shuffled=shuffleArr(questions);current=0;score=0;answered=false;currentQ=null;
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('score-panel').style.display='none';
  renderQuestion();
}
function renderQuestion(){
  answered=false;
  document.getElementById('btn-next').disabled=true;
  currentQ=shuffleOpts(shuffled[current]);
  const q=currentQ;
  document.getElementById('progress').style.width=(current/shuffled.length*100)+'%';
  document.getElementById('progress-label').textContent='Question '+(current+1)+' / '+shuffled.length;
  document.getElementById('question-container').innerHTML=
    '<div class="question-card">'+
    '<div class="question-num">Question '+(current+1)+'</div>'+
    '<div class="question-text">'+q.q+'</div>'+
    '<div class="options">'+q.opts.map((o,i)=>'<button class="option" onclick="answer('+i+')">'+o+'</button>').join('')+'</div>'+
    '<div class="feedback" id="feedback"></div>'+
    '</div>';
}
function answer(idx){
  if(answered)return;answered=true;
  const q=currentQ;
  const btns=document.querySelectorAll('.option');
  btns.forEach((b,i)=>{
    if(i===q.ans)b.classList.add('reveal');
    else if(i===idx)b.classList.add('wrong');
    b.onclick=null;
  });
  if(idx===q.ans)score++;
  const fb=document.getElementById('feedback');
  fb.textContent=q.fb;fb.style.display='block';
  document.getElementById('btn-next').disabled=false;
  document.getElementById('btn-next').textContent=current<shuffled.length-1?'Question suivante →':'Voir mon score';
}
function next(){
  current++;
  if(current>=shuffled.length){
    document.getElementById('quiz-area').style.display='none';
    document.getElementById('score-panel').style.display='block';
    document.getElementById('score-val').textContent=score+' / '+shuffled.length;
    const pct=Math.round(score/shuffled.length*100);
    document.getElementById('score-mention').textContent=pct===100?'Parfait !':pct>=70?'Bien joué !':'Encore un effort !';
  }else{renderQuestion();}
}
init();
</script>
</body>
</html>
