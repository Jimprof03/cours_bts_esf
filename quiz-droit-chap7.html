<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz – Politique de l'habitat et du logement</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0D1B2A;color:#f0eada;font-family:'Segoe UI',sans-serif;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  h1{color:#F4A261;font-size:1.5rem;text-align:center;letter-spacing:1px;}
  .subtitle{color:#8A9BB0;font-size:0.78rem;letter-spacing:2px;text-transform:uppercase;}
  #quiz-area{width:100%;max-width:680px;}
  .progress-bar{background:#1A3A5C;border-radius:10px;height:6px;margin-bottom:8px;}
  .progress-fill{background:#F4A261;height:6px;border-radius:10px;transition:width 0.4s;}
  .progress-label{font-size:0.7rem;color:#8A9BB0;margin-bottom:14px;letter-spacing:1px;}
  .question-card{background:#0f2040;border:1px solid #1A3A5C;border-radius:14px;padding:24px;}
  .question-num{font-size:0.7rem;color:#F4A261;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
  .question-text{font-size:1rem;font-weight:600;margin-bottom:20px;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{background:#0a1628;border:1.5px solid #1A3A5C;color:#f0eada;padding:12px 16px;border-radius:10px;cursor:pointer;text-align:left;font-size:0.88rem;line-height:1.4;transition:all 0.2s;}
  .option:hover{border-color:#F4A261;background:#1A3A5C;}
  .option.correct{background:#1a4a2e;border-color:#2ecc71;color:#2ecc71;}
  .option.wrong{background:#4a1a1a;border-color:#e74c3c;color:#e74c3c;}
  .option.reveal{background:#1a4a2e;border-color:#2ecc71;color:#2ecc71;}
  .feedback{margin-top:16px;padding:12px;background:#1A3A5C;border-radius:8px;font-size:0.82rem;line-height:1.5;display:none;color:#e8c87a;}
  #btn-next{margin-top:16px;background:#F4A261;color:#0D1B2A;border:none;padding:10px 28px;border-radius:8px;font-weight:700;font-size:0.82rem;letter-spacing:1px;cursor:pointer;width:100%;}
  #btn-next:disabled{opacity:0.4;cursor:not-allowed;}
  #score-panel{display:none;background:#0f2040;border:1px solid #F4A261;border-radius:14px;padding:24px;text-align:center;max-width:680px;width:100%;}
  #score-panel h2{color:#F4A261;font-size:1.8rem;}
  #score-panel p{color:#8A9BB0;margin-top:8px;font-size:0.85rem;}
  #btn-restart{margin-top:16px;background:#F4A261;color:#0D1B2A;border:none;padding:10px 28px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.82rem;letter-spacing:1px;}
</style>
</head>
<body>
<h1>Quiz – Politique de l'habitat et du logement</h1>
<p class="subtitle">BTS ESF</p>
<div id="quiz-area">
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="progress-label" id="progress-label">Question 1 / 10</div>
  <div id="question-container"></div>
  <button id="btn-next" disabled onclick="next()">Question suivante →</button>
</div>
<div id="score-panel">
  <h2 id="score-val"></h2>
  <p id="score-mention"></p>
  <button id="btn-restart" onclick="init()">Recommencer</button>
</div>
<script>
const questions = [
  { q: "Que prévoit la loi DALO de 2007 ?", opts: ["Elle instaure le prêt à taux zéro pour favoriser l'accession à la propriété des ménages modestes en France","Elle reconnaît le Droit Au Logement Opposable permettant aux personnes mal logées de le faire valoir","Elle crée le numéro d'urgence national 115 destiné aux personnes sans domicile fixe","Elle oblige toutes les communes à disposer d'au minimum 20% de logements sociaux dans leur parc"], ans: 1, fb: "La loi DALO (Droit Au Logement Opposable) de 2007 renforce la loi BESSON de 1990 en permettant aux personnes mal logées de faire valoir juridiquement leur droit au logement." },
  { q: "Qu'est-ce que le mal-logement ?", opts: ["Le simple fait de ne pas être propriétaire de son logement principal en France","Des situations de logement ne répondant pas aux normes minimales ou dont la durée n'est pas maîtrisée","Le fait de consacrer plus de 30% de ses revenus mensuels nets au paiement du loyer","Une situation en zone rurale très isolée, loin des services et commerces de proximité pour les bénéficiaires"], ans: 1, fb: "Le mal-logement regroupe les situations ne répondant pas aux normes minimales ou dans lesquelles la personne ne maîtrise pas la durée de son hébergement." },
  { q: "Quel est le rôle de l'ANAH ?", opts: ["Elle finance la construction de logements sociaux neufs destinés aux communes déficitaires","Elle finance la rénovation de l'habitat privé dégradé, en particulier pour les propriétaires modestes","Elle contrôle systématiquement la qualité de tous les logements HLM gérés par les bailleurs sociaux en France","Elle attribue directement les logements sociaux disponibles aux ménages qui en font la demande"], ans: 1, fb: "L'ANAH (Agence Nationale de l'Habitat) finance la rénovation de l'habitat privé dégradé, notamment pour les propriétaires modestes, et lutte contre l'habitat indigne." },
  { q: "Que met en place la loi ALUR de 2014 ?", opts: ["Elle crée pour les communes l'obligation légale d'atteindre 20% de logements sociaux","Elle met en place le numéro d'urgence 115 et réforme profondément l'urbanisme local","Elle crée le Fonds de Solidarité pour le Logement géré par les Conseils Départementaux","Elle instaure le prêt à taux zéro pour les primo-accédants à la propriété en France"], ans: 1, fb: "La loi ALUR (24 mars 2014) met notamment en place le 115 (numéro pour les sans-abri) et réforme l'urbanisme avec le PLU." },
  { q: "Qu'est-ce que le FSL ?", opts: ["Le Fichier national du Secteur Locatif pour gérer toutes les attributions de logements sociaux","Le Fonds de Solidarité pour le Logement : aide gérée par le CD pour les personnes en difficulté de logement","Le Fonds national de Subvention du Logement pour financer la construction de nouveaux logements HLM sur le territoire","Le Fonds Social du Logement pour aider les ménages à régler leur taxe foncière annuelle"], ans: 1, fb: "Le FSL (Fonds de Solidarité pour le Logement) est géré par le Conseil Départemental. Il aide les personnes en difficulté à accéder au logement ou à s'y maintenir." },
  { q: "Quelles sont les trois formes du mal-logement ?", opts: ["Absence totale de chauffage, absence d'eau courante et absence complète d'électricité","Mauvaise qualité de l'habitat, superficie insuffisante du logement et précarité de l'hébergement","Loyer trop élevé, charges trop importantes et éloignement des transports en commun accessibles","Insalubrité grave du bâtiment, vétusté des installations et absence totale de normes de sécurité"], ans: 1, fb: "Le mal-logement prend trois formes : mauvaise qualité de l'habitat (humidité, bruit...), superficie trop faible et précarité de l'hébergement (durée non maîtrisée)." },
  { q: "Que fait la loi BESSON de 1990 ?", opts: ["Elle crée des zones urbaines sensibles spéciales pour cibler les aides au logement social","Elle affirme le droit au logement pour toute personne résidant régulièrement en France","Elle oblige les propriétaires bailleurs à loger en priorité les personnes privées d'emploi","Elle crée le prêt à taux zéro pour favoriser l'accession sociale à la propriété immobilière"], ans: 1, fb: "La loi BESSON de 1990 est la première à affirmer le droit au logement pour toute personne résidant en France. Elle sera renforcée par la loi DALO en 2007." },
  { q: "Quel est le rôle de l'ANIL ?", opts: ["Elle attribue les aides personnelles au logement (APL, ALS) à toutes les personnes éligibles","Elle informe et conseille les particuliers sur leurs droits et obligations en matière de logement","Elle finance la construction de logements sociaux neufs pour les communes qui en manquent","Elle contrôle les niveaux de loyers pratiqués par tous les propriétaires dans les zones tendues en France"], ans: 1, fb: "L'ANIL (Agence Nationale pour l'Information sur le Logement) informe et conseille les particuliers (locataires, propriétaires) sur leurs droits et obligations." },
  { q: "Qu'est-ce que la DIHAL ?", opts: ["La Direction Interministérielle de l'Habitat pour les personnes défavorisées et sans logement sur le territoire","La Délégation Interministérielle à l'Hébergement et à l'Accès au Logement regroupant plusieurs ministres","La Direction Interdépartementale de l'Habitat et du Logement Social en France métropolitaine","La Délégation Interrégionale pour l'Habitat et l'Aménagement de tous les Logements sociaux"], ans: 1, fb: "La DIHAL (Délégation Interministérielle à l'Hébergement et à l'Accès au Logement) coordonne la politique nationale d'hébergement et d'accès au logement." },
  { q: "Quel est le rôle du PLH ?", opts: ["Un plan définissant les règles obligatoires d'accessibilité des logements neufs pour les PH","Un Programme Local de l'Habitat planifiant la politique du logement à l'échelle de la commune ou intercommunalité","Un programme régional de logement pour les PA piloté exclusivement par le Conseil Régional","Un plan local d'hébergement d'urgence pour toutes les personnes sans domicile dans la commune par les pouvoirs publics"], ans: 1, fb: "Le PLH (Programme Local de l'Habitat) est élaboré par les communes et intercommunalités pour planifier la politique locale du logement sur leur territoire." }
];
function shuffleArr(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function shuffleOpts(q){
  const idx=q.opts.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return{...q,opts:idx.map(i=>q.opts[i]),ans:idx.indexOf(q.ans)};
}
let shuffled,current,score,answered,currentQ;
function init(){
  shuffled=shuffleArr(questions);current=0;score=0;answered=false;currentQ=null;
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('score-panel').style.display='none';
  renderQuestion();
}
function renderQuestion(){
  answered=false;
  document.getElementById('btn-next').disabled=true;
  currentQ=shuffleOpts(shuffled[current]);
  const q=currentQ;
  document.getElementById('progress').style.width=(current/shuffled.length*100)+'%';
  document.getElementById('progress-label').textContent='Question '+(current+1)+' / '+shuffled.length;
  document.getElementById('question-container').innerHTML=
    '<div class="question-card">'+
    '<div class="question-num">Question '+(current+1)+'</div>'+
    '<div class="question-text">'+q.q+'</div>'+
    '<div class="options">'+q.opts.map((o,i)=>'<button class="option" onclick="answer('+i+')">'+o+'</button>').join('')+'</div>'+
    '<div class="feedback" id="feedback"></div>'+
    '</div>';
}
function answer(idx){
  if(answered)return;answered=true;
  const q=currentQ;
  const btns=document.querySelectorAll('.option');
  btns.forEach((b,i)=>{
    if(i===q.ans)b.classList.add('reveal');
    else if(i===idx)b.classList.add('wrong');
    b.onclick=null;
  });
  if(idx===q.ans)score++;
  const fb=document.getElementById('feedback');
  fb.textContent=q.fb;fb.style.display='block';
  document.getElementById('btn-next').disabled=false;
  document.getElementById('btn-next').textContent=current<shuffled.length-1?'Question suivante →':'Voir mon score';
}
function next(){
  current++;
  if(current>=shuffled.length){
    document.getElementById('quiz-area').style.display='none';
    document.getElementById('score-panel').style.display='block';
    document.getElementById('score-val').textContent=score+' / '+shuffled.length;
    const pct=Math.round(score/shuffled.length*100);
    document.getElementById('score-mention').textContent=pct===100?'Parfait !':pct>=70?'Bien joué !':'Encore un effort !';
  }else{renderQuestion();}
}
init();
</script>
</body>
</html>
